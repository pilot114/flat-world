<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<title>flat world</title>
	<style>
		body {
			background-color: cornsilk;
			font-family: Helvetica, Arial, sans-serif;
			margin: 0;
			padding: 1em;
		}
		#tabs {
			display: flex;
			gap: 0.5em;
			width: 1000px;
			padding-bottom: 0.75em;
		}
		/* высота фиксирована под три строки: описания разной длины иначе
		   двигали бы канвас при переключении вкладок */
		#scenarioInfo {
			margin: 0;
			width: 1000px;
			height: 3.9em;
			font-size: 13px;
			line-height: 1.3;
			color: #555;
			padding-bottom: 1em;
		}
		.tab {
			font: inherit;
			font-size: 13px;
			padding: 6px 14px;
			border: 1px solid #c8bfa4;
			border-radius: 4px;
			background-color: #f2ead6;
			color: #555;
			cursor: pointer;
		}
		.tab.active {
			background-color: #555;
			border-color: #555;
			color: cornsilk;
		}
		/* высота колонок зафиксирована, чтобы растущий текст не двигал канвас */
		#container {
			display: flex;
			align-items: flex-start;
			gap: 1em;
			height: 240px;
			padding-bottom: 1em;
		}
		#worldInfo, #selectPanel {
			width: 220px;
			height: 100%;
		}
		#worldInfo {
			overflow-y: auto;
		}
		#selectPanel {
			display: flex;
			flex-direction: column;
			gap: 0.5em;
			min-height: 0;
		}
		#selectInfo {
			overflow-y: auto;
		}
		/* вкладок классов бывает до четырёх, и они делят колонку в 220px —
		   поэтому они мельче вкладок сценариев и переносятся по строкам */
		#selectTabs {
			display: flex;
			flex-wrap: wrap;
			gap: 4px;
		}
		#selectTabs .tab {
			padding: 2px 6px;
			font-size: 11px;
		}
		#graph {
			flex: 0 0 400px;
		}
		/* цвет линии задаётся атрибутом stroke по виду существа —
		   правило CSS перебило бы его, поэтому цвета здесь нет */
		.line {
			fill: none;
			stroke-width: 1.5px;
		}
		/* оси рисуются вручную, поэтому их вид задаётся здесь целиком */
		.axis .domain,
		.axis .tick line {
			stroke: #000;
			fill: none;
		}
		.axis text {
			font-family: sans-serif;
			font-size: 10px;
			fill: #000;
		}
		#canvas {
			background-color: #ddd;
			display: block;
		}
		#species {
			width: 130px;
			font-size: 13px;
		}
		/* цвет, название, количество — легенда и палитра одновременно */
		.species {
			display: flex;
			align-items: center;
			gap: 0.5em;
			padding: 2px 0;
			cursor: pointer;
		}
		.species.active .species-name {
			font-weight: bold;
			text-decoration: underline;
		}
		.species-dot {
			width: 10px;
			height: 10px;
			border-radius: 50%;
		}
		.species-name {
			flex: 1;
		}
		.species-count {
			font-variant-numeric: tabular-nums;
		}
		#controls {
			display: flex;
			align-items: center;
			gap: 1em;
			width: 1000px;
			padding-bottom: 0.5em;
		}
		#playPause {
			flex: 0 0 auto;
			font: inherit;
			font-size: 13px;
			padding: 4px 10px;
			cursor: pointer;
		}
		#timeline {
			flex: 1;
		}
		#playerLabel {
			flex: 0 0 190px;
			font-size: 12px;
			color: #555;
		}
		#speedControl {
			display: flex;
			align-items: center;
			gap: 0.5em;
			flex: 0 0 auto;
			font-size: 12px;
			color: #555;
		}
		#speed {
			width: 90px;
		}
		/* ширина под «×0.25», чтобы соседи не дёргались при смене множителя */
		#speedLabel {
			width: 3em;
			font-variant-numeric: tabular-nums;
		}
		pre {
			font-size: 12px;
			margin: 0;
			white-space: pre-wrap;
		}
	</style>
</head>
<body>
	<div id="tabs"></div>
	<p id="scenarioInfo"></p>
	<div id="container">
		<pre id="worldInfo"></pre>
		<svg id="graph" width="400" height="200"></svg>
		<div id="species"></div>
		<div id="selectPanel">
			<div id="selectTabs"></div>
			<pre id="selectInfo"></pre>
		</div>
	</div>
	<div id="controls">
		<button id="playPause" type="button">⏸ Пауза</button>
		<input type="range" id="timeline" min="0" max="0" value="0" disabled>
		<span id="playerLabel"></span>
		<span id="speedControl">
			<label for="speed">скорость</label>
			<input type="range" id="speed">
			<span id="speedLabel"></span>
		</span>
	</div>
	<canvas id="canvas"></canvas>

	<script type="module" src="./src/main.js"></script>
</body>
</html>
