<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<title>flat world</title>
	<style>
		body {
			background-color: cornsilk;
			font-family: Helvetica, Arial, sans-serif;
			margin: 0;
			padding: 1em;
		}
		/* высота колонок зафиксирована, чтобы растущий текст не двигал канвас */
		#container {
			display: flex;
			align-items: flex-start;
			gap: 1em;
			height: 240px;
			padding-bottom: 1em;
		}
		#worldInfo, #selectInfo {
			width: 220px;
			height: 100%;
			overflow-y: auto;
		}
		#graph {
			flex: 0 0 400px;
		}
		.line {
			fill: none;
			stroke: #000;
			stroke-width: 1.5px;
		}
		#canvas {
			background-color: #ddd;
			display: block;
		}
		#species {
			width: 130px;
			font-size: 13px;
		}
		/* цвет, название, количество — легенда и палитра одновременно */
		.species {
			display: flex;
			align-items: center;
			gap: 0.5em;
			padding: 2px 0;
			cursor: pointer;
		}
		.species.active .species-name {
			font-weight: bold;
			text-decoration: underline;
		}
		.species-dot {
			width: 10px;
			height: 10px;
			border-radius: 50%;
		}
		.species-name {
			flex: 1;
		}
		.species-count {
			font-variant-numeric: tabular-nums;
		}
		#controls {
			display: flex;
			align-items: center;
			gap: 1em;
			width: 1000px;
			padding-bottom: 0.5em;
		}
		#playPause {
			flex: 0 0 auto;
			font: inherit;
			font-size: 13px;
			padding: 4px 10px;
			cursor: pointer;
		}
		#timeline {
			flex: 1;
		}
		#playerLabel {
			flex: 0 0 190px;
			font-size: 12px;
			color: #555;
		}
		pre {
			font-size: 12px;
			margin: 0;
			white-space: pre-wrap;
		}
	</style>
</head>
<body>
	<div id="container">
		<pre id="worldInfo"></pre>
		<svg id="graph" width="400" height="200"></svg>
		<div id="species"></div>
		<pre id="selectInfo"></pre>
	</div>
	<div id="controls">
		<button id="playPause" type="button">⏸ Пауза</button>
		<input type="range" id="timeline" min="0" max="0" value="0" disabled>
		<span id="playerLabel"></span>
	</div>
	<canvas id="canvas"></canvas>

	<script src="./vendor/d3.js"></script>
	<script type="module" src="./src/main.js"></script>
</body>
</html>
