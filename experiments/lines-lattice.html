<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Решётка из звёзд</title>
    <style>
        body {
            font-family: Helvetica, Arial, sans-serif;
            background-color: cornsilk;
            padding: 1em;
        }
        #canvas {
            background-color: #ddd;
            display: block;
        }
    </style>
</head>
<body>
    <p>Нарисовать структуру для проверки гипотезы.</p>

    <canvas id="canvas"></canvas>

    <script src="./drawLine.js"></script>
    <script>
        const LENGTH = 100;
        const ROWS = 7;
        const PER_ROW = 7;
        const RAYS = 12;          // лучей в звезде
        const RAY_STEP = 360 / RAYS;
        const BRANCH_ANGLE = 120; // излом на конце каждого луча

        // Шаг вдоль ряда и шаг между рядами.
        const stepAlong = (x, y) => [x + 100 + 100 * Math.sin(1) + 3, y + 100 * Math.cos(1) - 3];
        const stepDown = (x, y) => [x + 100 * Math.cos(1) - 3, y + 100 + 100 * Math.sin(1) + 3];

        // Центры звёзд: ряды идут вниз, внутри ряда — вдоль.
        function buildCenters() {
            const centers = [];
            let rowStart = [-300, -300];

            for (let row = 0; row < ROWS; row++) {
                let point = rowStart;
                for (let i = 0; i < PER_ROW; i++) {
                    centers.push(point);
                    point = stepAlong(point[0], point[1]);
                }
                rowStart = stepDown(rowStart[0], rowStart[1]);
            }

            return centers;
        }

        const centers = buildCenters();

        window.addEventListener('load', function () {
            const canvas = document.getElementById('canvas');
            canvas.width = 1000;
            canvas.height = 800;
            const context = canvas.getContext('2d');

            (function draw() {
                requestAnimationFrame(draw);

                context.clearRect(0, 0, canvas.width, canvas.height);

                for (const center of centers) {
                    for (let i = 0; i < RAYS; i++) {
                        const angle = i * RAY_STEP;
                        const end = drawLine(context, center, LENGTH, angle);
                        drawLine(context, end, LENGTH, angle + BRANCH_ANGLE);
                    }
                }
            })();
        });
    </script>
</body>
</html>
